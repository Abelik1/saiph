<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saiph ad captions</title>
<!-- Caption layer for every set, composited over the Blender render. Reads
     sets/<set>.json. Text stays inside the 9:16 safe area: clear of the top 14%
     (account name) and the bottom 35% (caption, buttons) on Reels and TikTok. -->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { width: var(--w); height: var(--h); position: relative; color: #f3f7fb; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; }
  .cap { position: absolute; left: 70px; right: 70px; text-align: center; font-weight: 700; letter-spacing: -0.03em; line-height: 1.04;
    font-size: var(--cap, 84px); text-shadow: 0 3px 34px rgba(3, 6, 12, .9), 0 0 3px rgba(3, 6, 12, .7); }
  .tally { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; align-items: center; padding: 14px 26px; border-radius: 999px;
    background: rgba(6, 10, 18, .72); border: 1px solid rgba(103, 232, 249, .45); font-size: 34px; font-weight: 600; white-space: nowrap; backdrop-filter: blur(6px); }
  .tally b { font-size: 44px; color: #67e8f9; }
  .beta { position: absolute; left: 60px; font-size: 22px; color: #b6c4d4; padding: 6px 16px; border-radius: 10px; background: rgba(6, 10, 18, .6); white-space: nowrap; }
  .end { position: absolute; left: 0; right: 0; display: grid; justify-items: center; gap: 18px; text-align: center; }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 64px; font-weight: 600; letter-spacing: -0.02em; }
  .brand svg { width: 86px; height: 86px; }
  .tag { font-size: 64px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; text-shadow: 0 3px 30px rgba(3, 6, 12, .9); }
  .platforms { font-size: 34px; color: #b6c4d4; }
  .pill { margin-top: 10px; padding: 18px 34px; border-radius: 999px; font-size: 36px; font-weight: 650; color: #04121a; background: linear-gradient(120deg, #22d3ee, #7dd3fc 55%, #a78bfa); }
  .scrim { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 50%, rgba(3, 6, 12, .78), rgba(3, 6, 12, .35)); }
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="cap" id="cap"></div>
<div class="tally" id="tally"><span id="tallyLabel"></span><b id="tallyValue"></b></div>
<div class="beta" id="beta"></div>
<div class="end" id="end">
  <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="s" x1="8" y1="29" x2="32" y2="11" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#e7edf4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><radialGradient id="g"><stop offset="0" stop-color="#67e8f9" stop-opacity=".55"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient></defs><circle cx="20" cy="20" r="11" fill="url(#g)"/><path d="M8 29Q15.3 26.5 20 20Q24.7 13.5 32 11" fill="none" stroke="url(#s)" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="29" r="2.6" fill="#67e8f9"/><circle cx="20" cy="20" r="3" fill="#e7edf4"/><circle cx="32" cy="11" r="2.6" fill="#a78bfa"/></svg><span>saiph</span></div>
  <div class="tag" id="tag"></div>
  <div class="platforms">Android · Windows · Linux</div>
  <div class="pill">14 days free · usesaiph.com</div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const W = Number(q.get('w') || 1080), H = Number(q.get('h') || 1920), still = q.get('still');
  document.body.style.setProperty('--w', W + 'px');
  document.body.style.setProperty('--h', H + 'px');
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
  const beat = (t, a, b, f = 0.3) => Math.min(ease((t - a) / f), 1 - ease((t - (b - f)) / f));
  const place = (el, frac, o, rise = 26) => { el.style.top = (H * frac) + 'px'; el.style.opacity = o; el.style.translate = `0 ${(1 - o) * rise}px`; };
  let set;
  window.setTime = (t) => {
    const s = H / W < 1.5;  // portrait 4:5 and square stills use a tighter layout
    document.body.style.setProperty('--cap', (s ? 76 : 84) + 'px');
    if (still) {
      const c = set.stills[still];
      $('cap').innerHTML = c.caption; place($('cap'), s ? 0.07 : 0.16, 1);
      $('tally').style.display = c.tally ? '' : 'none';
      if (c.tally) { $('tallyLabel').textContent = set.tally.label; $('tallyValue').textContent = set.tally.value; place($('tally'), s ? 0.07 + c.capLines * 0.07 : 0.31, 1); }
      $('beta').style.display = 'none'; $('scrim').style.opacity = 0;
      $('end').style.gridAutoFlow = 'column'; $('end').style.alignItems = 'center'; $('end').style.justifyContent = 'center'; $('end').style.gap = '34px';
      [...$('end').children].forEach((el) => { el.style.display = el.classList.contains('brand') || el.classList.contains('pill') ? '' : 'none'; });
      place($('end'), s ? 0.86 : 0.8, 1);
      return;
    }
    const cap = set.captions.find((c) => t >= c.from && t < c.to);
    $('cap').innerHTML = cap ? cap.text : '';
    place($('cap'), 0.16, cap ? beat(t, cap.from, cap.to) : 0);
    const ta = set.tally;
    if (ta) { $('tallyLabel').textContent = ta.label; $('tallyValue').textContent = ta.value; place($('tally'), 0.315, beat(t, ta.from, ta.to), 0); } else $('tally').style.display = 'none';
    const b = (set.beta || []).find((x) => t >= x.from && t < x.to);
    $('beta').textContent = b ? b.text : '';
    // Bottom-left corner, over the keyboard; the lowest quarter is left to the Reels/TikTok caption.
    place($('beta'), 0.7, b ? beat(t, b.from, b.to, 0.2) : 0, 0);
    const e = set.end;
    $('tag').innerHTML = e.tag;
    const k = beat(t, e.from, set.duration + 1, 0.45);
    place($('end'), 0.36, k, 40);
    $('scrim').style.opacity = k;
  };
  window.ready = fetch(`sets/${q.get('set')}.json`).then((r) => r.json()).then((json) => { set = json; window.setTime(Number(q.get('t') || 0)); return true; });
</script>
</body>
</html>
