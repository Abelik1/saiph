<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set B laptop screen</title>
<!-- Set B's laptop: a document where the phone's copied address is pasted, a link copied
     for the phone, and a slide where the phone's photo is pasted. Generic apps; the
     clipboard moving between devices is the Saiph part. -->
<style>
  html, body { margin: 0; width: 1920px; height: 1200px; overflow: hidden; background: #050a14; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
  .scene { position: absolute; inset: 0; display: none; }
  .wall { position: absolute; inset: 0; background: radial-gradient(900px 600px at 20% 10%, #0d3a4a, transparent 70%), radial-gradient(900px 700px at 90% 90%, #241a55, transparent 70%), #050a14; }
  .win { position: absolute; left: 120px; top: 70px; right: 120px; bottom: 120px; border-radius: 18px; overflow: hidden; background: #fbfbfc; color: #111827; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .bar { height: 64px; background: #eceff3; display: flex; align-items: center; gap: 16px; padding: 0 24px; font-size: 22px; color: #374151; border-bottom: 1px solid #d6dbe2; }
  .dots { display: flex; gap: 10px; } .dots b { width: 15px; height: 15px; border-radius: 50%; background: #c3c9d3; display: block; }
  .page { padding: 70px 120px; font-size: 44px; line-height: 1.55; }
  .page h1 { font-size: 64px; margin: 0 0 30px; letter-spacing: -.02em; }
  .caret { display: inline-block; width: 3px; height: 1.05em; background: #111827; vertical-align: -0.18em; margin-left: 2px; }
  .flash { border-radius: 8px; padding: 0 6px; }
  .url { flex: 1; height: 44px; border-radius: 22px; background: #fff; display: flex; align-items: center; padding: 0 20px; font-size: 26px; color: #374151; }
  .url span.sel { background: #93c5fd; border-radius: 4px; padding: 2px 4px; }
  .article { padding: 60px 140px; font-size: 40px; line-height: 1.5; color: #1f2937; }
  .slide { position: absolute; left: 260px; top: 150px; width: 1160px; height: 652px; background: #fff; box-shadow: 0 6px 30px rgba(0,0,0,.12); border: 1px solid #e5e7eb; }
  .slide h2 { margin: 50px 60px; font-size: 64px; letter-spacing: -.02em; }
  .slide .img { position: absolute; left: 330px; top: 170px; width: 500px; height: 420px; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .chip { position: absolute; left: 50%; transform: translateX(-50%); bottom: 150px; display: flex; gap: 12px; align-items: center; font-size: 34px; color: #e2e8f0;
    background: rgba(10,16,28,.92); padding: 16px 26px; border-radius: 18px; border: 1px solid #2a3b58; }
  .chip kbd { font: 600 30px "Segoe UI", sans-serif; padding: 8px 16px; border-radius: 10px; background: #1e293b; border: 1px solid #475569; border-bottom-width: 4px; }
</style>
</head>
<body>
<div class="wall"></div>
<div class="scene" id="doc"><div class="win"><div class="bar"><div class="dots"><b></b><b></b><b></b></div>Saturday plans · Document</div>
  <div class="page"><h1>Saturday</h1>Meet at: <span class="flash" id="docPaste"></span><span class="caret" id="caret1"></span></div></div></div>
<div class="scene" id="web"><div class="win"><div class="bar"><div class="dots"><b></b><b></b><b></b></div><div class="url"><span id="urlText">https://usesaiph.com</span></div></div>
  <div class="article"><h1 style="font-size:60px;letter-spacing:-.02em;margin:0 0 24px">Your devices. Connected.</h1>Clipboard, notifications and files across Android, Windows and Linux.</div></div></div>
<div class="scene" id="slides"><div class="win" style="background:#f3f4f6"><div class="bar"><div class="dots"><b></b><b></b><b></b></div>Weekend · Slides</div></div>
  <div class="slide"><h2>Weekend</h2><div class="img" id="slideImg"><svg width="500" height="420" viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a63c2e"/><stop offset=".45" stop-color="#c97a4a"/><stop offset="1" stop-color="#e3d684"/></linearGradient></defs><rect width="100" height="100" fill="url(#sky)"/><circle cx="32" cy="34" r="12" fill="#bff3f1"/><path d="M0 74 Q20 64 40 72 T80 68 T100 70 V100 H0Z" fill="#4a1f1a" opacity=".75"/><path d="M0 84 Q30 76 60 84 T100 82 V100 H0Z" fill="#2b1210" opacity=".85"/></svg></div></div></div>
<div class="chip" id="chip"><kbd>Ctrl</kbd>+<kbd id="chipKey">V</kbd></div>
<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
  const showIf = (el, on) => { el.style.display = on ? '' : 'none'; };
  window.setTime = (t) => {
    const scene = t < 4.0 ? 'doc' : t < 7.9 ? 'web' : 'slides';
    for (const id of ['doc', 'web', 'slides']) $(id).style.display = id === scene ? 'block' : 'none';
    // Document: the address copied on the phone lands with Ctrl+V at 3.05 s.
    const p = t >= 3.05;
    $('docPaste').textContent = p ? '14 Harbour Road, Dublin 4' : '';
    $('docPaste').style.background = p ? `rgba(34, 211, 238, ${0.5 * (1 - clamp((t - 3.05) / 0.9))})` : 'none';
    $('caret1').style.opacity = Math.floor(t * 2.4) % 2 ? 1 : 0.2;
    // Browser: the link is selected and copied with Ctrl+C at 4.95 s.
    $('urlText').className = t >= 4.35 ? 'sel' : '';
    // Slides: the phone's photo pasted at 8.4 s.
    const img = clamp((t - 8.4) / 0.25);
    $('slideImg').style.opacity = img; $('slideImg').style.transform = `scale(${0.9 + 0.1 * ease(img)})`;
    const chip = (t >= 2.5 && t < 3.5) ? 'V' : (t >= 4.7 && t < 5.4) ? 'C' : (t >= 8.0 && t < 8.9) ? 'V' : null;
    showIf($('chip'), !!chip); if (chip) $('chipKey').textContent = chip;
  };
  window.ready = Promise.resolve(true).then(() => { window.setTime(0); return true; });
</script>
</body>
</html>
