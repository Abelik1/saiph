<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set B phone screen</title>
<!-- Set B's phone: generic Android surfaces (a note, a chat, a photo) where text and a
     picture are copied and a link from the PC is pasted. Saiph itself works in the
     background, so none of its own screens appear here. -->
<style>
  html, body { margin: 0; width: 900px; height: 1970px; overflow: hidden; background: #000; font-family: Roboto, "Segoe UI", system-ui, sans-serif; color: #e8eaed; }
  .scene { position: absolute; inset: 0; display: none; }
  .status { position: absolute; left: 0; right: 0; top: 0; height: 90px; display: flex; justify-content: space-between; align-items: center; padding: 0 54px; font-size: 34px; font-weight: 500; z-index: 5; }
  .appbar { position: absolute; left: 0; right: 0; top: 100px; height: 120px; display: flex; align-items: center; gap: 30px; padding: 0 44px; font-size: 44px; }
  .note { position: absolute; left: 60px; right: 60px; top: 280px; font-size: 52px; line-height: 1.45; }
  .note h2 { font-size: 64px; margin: 0 0 30px; font-weight: 500; }
  .sel { background: rgba(138, 180, 248, .45); border-radius: 4px; }
  .handle { display: inline-block; width: 26px; height: 26px; border-radius: 0 50% 50% 50%; background: #8ab4f8; vertical-align: -38px; }
  .handle.r { border-radius: 50% 0 50% 50%; }
  .toolbar { position: absolute; display: flex; gap: 0; background: #303134; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.6); font-size: 40px; overflow: hidden; }
  .toolbar span { padding: 26px 34px; }
  .toolbar span.hit { background: #4a4c50; }
  .chip { position: absolute; left: 50px; bottom: 170px; display: flex; gap: 20px; align-items: center; padding: 26px 34px; border-radius: 26px; background: #2b2d31; font-size: 36px; box-shadow: 0 12px 30px rgba(0,0,0,.6); }
  .chip i { width: 64px; height: 64px; border-radius: 14px; background: #3c4043; display: grid; place-items: center; font-style: normal; font-size: 30px; overflow: hidden; }
  .ripple { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; background: rgba(255,255,255,.35); }
  .bubble { position: absolute; max-width: 620px; padding: 30px 38px; border-radius: 44px; font-size: 44px; line-height: 1.35; }
  .in { left: 44px; background: #303134; border-bottom-left-radius: 12px; }
  .out { right: 44px; background: #0b57d0; border-bottom-right-radius: 12px; }
  .compose { position: absolute; left: 34px; right: 34px; bottom: 120px; height: 130px; border-radius: 65px; background: #303134; display: flex; align-items: center; padding: 0 48px; font-size: 42px; color: #9aa0a6; }
  .compose.focus { outline: 4px solid #8ab4f8; color: #e8eaed; }
  .photo { position: absolute; left: 0; right: 0; top: 420px; height: 900px; }
  .home { position: absolute; left: 50%; bottom: 40px; width: 260px; height: 10px; margin-left: -130px; border-radius: 5px; background: #e8eaed; }
</style>
</head>
<body>
<div class="status"><span>10:24</span><span>▾ ▴ ▮ 81%</span></div>

<div class="scene" id="notes">
  <div class="appbar">‹ <span style="flex:1">Notes</span>⋮</div>
  <div class="note"><h2>Saturday</h2>Dinner at the place near the canal. <span id="selWrap"><span class="handle" id="hl"></span><span id="sel">14 Harbour Road, Dublin 4</span><span class="handle r" id="hr"></span></span>. Table for four at 7.</div>
  <div class="toolbar" id="tb1" style="left:120px;top:520px"><span>Cut</span><span id="copy1">Copy</span><span>Paste</span><span>Share</span><span>Select all</span></div>
</div>

<div class="scene" id="chat">
  <div class="appbar">‹ <span style="flex:1">Niamh Walsh</span>⋮</div>
  <div class="bubble in" style="top:330px">Send me the link for that app?</div>
  <div class="bubble out" id="sent" style="top:560px">https://usesaiph.com</div>
  <div class="compose" id="compose"><span id="composeText">Message</span></div>
  <div class="toolbar" id="tb2" style="left:60px;bottom:280px"><span id="paste2">Paste</span><span>Select all</span></div>
</div>

<div class="scene" id="gallery">
  <div class="appbar">‹ <span style="flex:1">Today · 10:21</span>⋮</div>
  <div class="photo"><svg width="900" height="900" viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a63c2e"/><stop offset=".45" stop-color="#c97a4a"/><stop offset="1" stop-color="#e3d684"/></linearGradient></defs><rect width="100" height="100" fill="url(#sky)"/><circle cx="32" cy="34" r="12" fill="#bff3f1"/><path d="M0 74 Q20 64 40 72 T80 68 T100 70 V100 H0Z" fill="#4a1f1a" opacity=".75"/><path d="M0 84 Q30 76 60 84 T100 82 V100 H0Z" fill="#2b1210" opacity=".85"/></svg></div>
  <div class="toolbar" id="tb3" style="left:250px;top:780px"><span id="copy3">Copy</span><span>Share</span><span>Edit</span></div>
</div>

<div class="chip" id="chipCopied"><i id="chipThumb">⧉</i><span>Copied</span></div>
<div class="ripple" id="ripple"></div>
<div class="home"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
  const showIf = (el, on) => { el.style.display = on ? '' : 'none'; };
  function rippleAt(t, at, el) {
    const on = t >= at && t < at + 0.35;
    showIf($('ripple'), on);
    if (!on || !el) return;
    const r = el.getBoundingClientRect(), k = (t - at) / 0.35;
    $('ripple').style.left = (r.left + r.width / 2) + 'px'; $('ripple').style.top = (r.top + r.height / 2) + 'px';
    $('ripple').style.transform = `scale(${0.3 + k * 1.2})`; $('ripple').style.opacity = 1 - k;
  }
  window.setTime = (t) => {
    const scene = t < 4.0 ? 'notes' : t < 7.0 ? 'chat' : 'gallery';
    for (const id of ['notes', 'chat', 'gallery']) $(id).style.display = id === scene ? 'block' : 'none';
    let tapAt = null, tapEl = null;
    if (scene === 'notes') {
      // Long-press selects the address; the toolbar offers Copy; Copy is tapped.
      const grow = ease((t - 0.35) / 0.5);
      showIf($('hl'), t >= 0.35); showIf($('hr'), t >= 0.35);
      $('sel').className = t >= 0.35 ? 'sel' : '';
      $('sel').style.backgroundSize = `${grow * 100}% 100%`;
      showIf($('tb1'), t >= 0.9 && t < 1.65);
      $('copy1').className = t >= 1.4 && t < 1.65 ? 'hit' : '';
      tapAt = 1.4; tapEl = $('copy1');
      showIf($('chipCopied'), t >= 1.65 && t < 3.9); $('chipThumb').textContent = '⧉';
    }
    if (scene === 'chat') {
      // The link copied on the PC arrives in the phone's clipboard; long-press, Paste.
      const focused = t >= 5.45;
      $('compose').className = 'compose' + (focused ? ' focus' : '');
      const pasted = t >= 6.15;
      $('composeText').textContent = pasted && t < 6.6 ? 'https://usesaiph.com' : 'Message';
      showIf($('tb2'), t >= 5.6 && t < 6.15);
      $('paste2').className = t >= 5.95 && t < 6.15 ? 'hit' : '';
      showIf($('sent'), t >= 6.6);
      tapAt = 5.95; tapEl = $('paste2');
      showIf($('chipCopied'), false);
    }
    if (scene === 'gallery') {
      showIf($('tb3'), t >= 7.25 && t < 7.75);
      $('copy3').className = t >= 7.55 && t < 7.75 ? 'hit' : '';
      tapAt = 7.55; tapEl = $('copy3');
      showIf($('chipCopied'), t >= 7.75 && t < 9.6);
      $('chipThumb').innerHTML = '<svg width="64" height="64" viewBox="0 0 10 10"><rect width="10" height="10" fill="#c97a4a"/><circle cx="3.2" cy="3.4" r="1.3" fill="#bff3f1"/></svg>';
    }
    rippleAt(t, tapAt, tapEl);
  };
  window.ready = Promise.resolve(true).then(() => { window.setTime(0); return true; });
</script>
</body>
</html>
