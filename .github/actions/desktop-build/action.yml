name: Build the Saiph desktop
description: Tests the checked-out public source, then builds the Electron Link edition on this runner's operating system.
inputs:
  qt:
    description: Reviewed PySide6 version for this platform
    required: true
  version:
    description: Semantic release version
    required: true
  build-number:
    description: Increasing build number (0-65535)
    required: true
  hosted-config:
    description: The five public Saiph Cloud settings (JSON); never secrets
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
    - name: Linux native build libraries
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils libegl1 libgtk-3-0 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libx11-xcb1 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxtst6 libasound2 libxdamage1 libxrandr2 libxcomposite1 libgbm1
    - name: Desktop dependencies with reviewed Qt notice version
      shell: bash
      run: python -m pip install -e ".[dev,hosted]" "PySide6==${{ inputs.qt }}" -r hub/requirements-hosted.txt httpx
    - shell: bash
      run: npm --prefix frontend ci
    - shell: bash
      run: npm --prefix desktop ci
    - name: Fetch the Electron runtime when npm skipped it
      shell: bash
      run: node desktop/node_modules/electron/install.js
    - name: Public fixture and delegate boundary
      shell: bash
      run: python scripts/public-release/check-public-data.py
    - name: Exported Python unit suite
      shell: bash
      run: python scripts/public-release/verify-public.py
    - shell: bash
      run: npm --prefix frontend run test:unit
    - shell: bash
      run: npm --prefix desktop test
    - name: Build Link with the Saiph Cloud defaults
      shell: python
      env:
        HOSTED_CONFIG: ${{ inputs.hosted-config }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_BUILD: ${{ inputs.build-number }}
      run: |
        import os, subprocess, sys
        from pathlib import Path
        config = Path(os.environ['RUNNER_TEMP']) / 'hosted-defaults.json'
        config.write_text(os.environ['HOSTED_CONFIG'], encoding='utf-8')
        subprocess.run([sys.executable, 'scripts/build-native.py', '--profile', 'link', '--version', os.environ['RELEASE_VERSION'],
                        '--build-number', os.environ['RELEASE_BUILD'], '--hosted-config', str(config)], check=True)
