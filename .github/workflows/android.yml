name: Android
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'scripts/android/**', '.github/workflows/android.yml']
  push:
    branches: [main]
    paths: ['android/**', 'scripts/android/**', '.github/workflows/android.yml']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '22'
      - name: Use isolated build directories
        run: |
          "GRADLE_USER_HOME=$env:RUNNER_TEMP/saiph-gradle" >> $env:GITHUB_ENV
      - name: Android platform, build tools and NDK
        run: '& "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"'
      - name: Generate native restic inputs from pinned source
        run: python scripts/build-restic.py --android-root . --sdk "$env:ANDROID_HOME"
      - name: Verify resolved Maven security floors
        run: ./gradlew.bat verifyDependencySecurity :build-logic:verifyDependencySecurity --init-script ../scripts/android/dependency-review.init.gradle -PorionFirebase=false -PorionIndependent=true -PorionPush=false -PorionVersionCode=1 --no-configuration-cache --stacktrace
      - name: Compile, test and lint both Android apps
        run: ./gradlew.bat :app:assembleDirectDebug :app:assembleDirectBeta :app:assemblePlayDebug :app:testDirectDebugUnitTest :app:testPlayDebugUnitTest :core:network:testDebugUnitTest :restic-android:testDebugUnitTest :app:lintDirectDebug :app:lintDirectBeta :app:lintPlayDebug -PorionPush=false -PorionFirebase=false -PorionIndependent=true -PorionVersionCode=1 --no-configuration-cache --stacktrace
      - name: Build unsigned public release candidates
        run: ./gradlew.bat :app:assembleDirectRelease :app:assemblePlayRelease :app:bundlePlayRelease -PorionPush=false -PorionFirebase=false -PorionIndependent=true -PorionVersionCode=1 --no-configuration-cache --stacktrace
      - name: Verify launcher labels, package IDs and Play permissions
        run: |
          $aapt = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Filter aapt2.exe -Recurse | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $apps = @{direct=@('Saiph Unlocked', 'com\.orionmini\.mobile\.unlocked'); play=@('Saiph', 'com\.orionmini\.mobile')}
          foreach ($flavor in $apps.Keys) {
            $apk = "app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            $badging = & $aapt dump badging $apk
            if ($LASTEXITCODE) { throw "Unable to read $flavor APK metadata." }
            if ($badging -notcontains "application-label:'$($apps[$flavor][0])'" -or
                -not ($badging -match "^package: name='$($apps[$flavor][1])' versionCode='1' ") -or
                ($badging -match '^application-debuggable')) {
              throw "$flavor APK has unexpected launcher branding, package identity or debug state."
            }
            if ($flavor -eq 'play' -and ($badging -match "^uses-permission(?:-sdk-\d+)?: name='android\.permission\.(REQUEST_INSTALL_PACKAGES|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|ACCESS_BACKGROUND_LOCATION|USE_FULL_SCREEN_INTENT|RECEIVE_SENSITIVE_NOTIFICATIONS)'")) {
              throw 'A direct-only permission was found in the Play APK.'
            }
          }
  dependency-graph:
    # Publishes Android dependencies to GitHub's dependency graph so vulnerability
    # alerts cover Gradle. Never runs for pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '22'
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: android
